aid: smsapi
url: https://raw.githubusercontent.com/api-evangelist/smsapi/refs/heads/main/apis.yml
name: SMSAPI
kind: company
description: SMSAPI is a European bulk business-messaging provider headquartered in
  Poland and part of LINK Mobility. Its REST API delivers SMS, MMS, and voice (VMS)
  messaging, email marketing, two-factor authentication, contact and group management,
  sender field registration, subuser administration, and account/profile operations,
  authenticated with OAuth 2.0 bearer tokens over api.smsapi.com and api.smsapi.eu.
