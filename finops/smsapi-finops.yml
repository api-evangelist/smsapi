meters:
- name: sms_segments
  description: SMS message segments sent, billed per segment by destination and operator.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - subuser
  - country
  - sender
- name: mms_messages
  description: MMS multimedia messages sent, billed per message by destination.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - subuser
  - country
- name: vms_calls
  description: VMS voice messages delivered, billed per call by destination and duration.
  unit: calls
  aggregation: sum
  dimensions:
  - account
  - subuser
  - country
- name: two_fa_messages
  description: 2FA one-time-passcode deliveries, billed as the underlying SMS or voice message.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - channel
- name: hlr_lookups
  description: HLR number-validation lookups, billed per lookup.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - country
- name: points_balance
  description: Prepaid credit (points) topped up and drawn down across all messaging.
  unit: points
  aggregation: sum
  dimensions:
  - account
  - subuser
principles:
- name: Visibility
  description: Pull customer-panel usage reports and delivery callbacks; track points burn per subuser, country, and sender.
- name: Allocation
  description: Use subusers and per-token separation to map messaging spend to teams, campaigns, or clients.
- name: Optimization
  description: Right-size message length and encoding to reduce segment count; batch recipients; run HLR before large sends to drop invalid numbers; negotiate volume rates.
- name: Accountability
  description: Assign owners per subuser/route; monitor prepaid balance and set top-up alerts to avoid send interruptions.
