description: >-
  FinOps view of SMSAPI spend. SMSAPI uses a prepaid credit ("points") model:
  every SMS, MMS, VMS voice message, HLR lookup, and 2FA delivery draws down a
  topped-up balance at a per-message rate that depends on destination country,
  operator, message length (segments), and negotiated volume. Because charges
  are prepaid and per-message, cost governance centers on tracking points burn
  per subuser/route, right-sizing message length and encoding, and negotiating
  volume rates.
notes: >-
  SMSAPI is part of LINK Mobility. Per-message rates are destination- and
  volume-dependent; verify against the SMSAPI pricing page and customer-panel
  usage reports during reconciliation.
